[project]
name = "chatrobot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "刘东旭", email = "dennisliu1988@163.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
chatrobot = "app:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""
