<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 聊天机器人</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Marked for Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js for Code -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.2); border-radius: 9999px; }
        .markdown-body pre {
            background: #18181b !important;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 0.5rem;
            padding: 0.875rem;
            overflow-x: auto;
            margin: 0.5rem 0;
        }
        .markdown-body code:not(pre code) {
            background: rgba(255, 255, 255, 0.1);
            color: #38bdf8;
            padding: 0.15rem 0.35rem;
            border-radius: 0.25rem;
            font-size: 0.875em;
        }
        .markdown-body p { margin-bottom: 0.5rem; line-height: 1.6; }
        .markdown-body p:last-child { margin-bottom: 0; }
        .cursor-blink {
            display: inline-block;
            width: 4px;
            height: 15px;
            background-color: #10b981;
            vertical-align: text-bottom;
            margin-left: 3px;
            animation: blink 1s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-100 h-screen flex flex-col antialiased">

    <!-- 极简顶部栏 -->
    <header class="h-14 border-b border-slate-800 bg-[#0f172a]/80 backdrop-blur px-6 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-2.5">
            <span class="font-medium text-sm text-slate-200">AI 聊天助手</span>
            <!-- 真实的在线检测状态 -->
            <span id="statusBadge" class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-xs font-medium bg-slate-800 text-slate-400 border border-slate-700">
                <span id="statusDot" class="w-1.5 h-1.5 rounded-full bg-slate-400"></span>
                <span id="statusText">检测中</span>
            </span>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="clearChat()" title="清空对话" class="p-1.5 text-slate-400 hover:text-slate-200 hover:bg-slate-800 rounded-lg text-xs flex items-center gap-1">
                <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                <span>清空</span>
            </button>
        </div>
    </header>

    <!-- 内容展示区域（干净纯粹，无任何多余卡片） -->
    <main class="flex-1 overflow-y-auto px-4 py-6 md:px-0" id="chatContainer">
        <div class="max-w-3xl mx-auto space-y-6" id="messagesList"></div>
    </main>

    <!-- 底部输入框 -->
    <footer class="shrink-0 border-t border-slate-800/80 bg-[#0f172a] p-4">
        <div class="max-w-3xl mx-auto">
            <div class="relative flex items-end gap-2 bg-slate-800/70 border border-slate-700 focus-within:border-emerald-500 rounded-xl p-2 transition-all">
                <textarea 
                    id="inputMessage" 
                    rows="1" 
                    placeholder="输入问题... (Enter 发送，Shift+Enter 换行)"
                    class="w-full bg-transparent text-slate-100 placeholder-slate-400 resize-none outline-none text-sm px-2 py-1.5 max-h-40"
                    oninput="adjustTextarea(this)"></textarea>
                
                <button 
                    id="sendBtn" 
                    onclick="sendMessage()" 
                    class="shrink-0 p-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 active:scale-95 disabled:opacity-40 disabled:pointer-events-none text-white transition-all">
                    <i data-lucide="arrow-up" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </footer>

    <script>
        lucide.createIcons();

        let conversationHistory = [];
        let isGenerating = false;

        // 真实检测后端服务状态 (通过 /health 接口)
        async function checkHealth() {
            const badge = document.getElementById('statusBadge');
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');

            try {
                const res = await fetch('health', { method: 'GET', cache: 'no-store' });
                if (res.ok) {
                    badge.className = "inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
                    dot.className = "w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse";
                    text.textContent = "在线";
                    return;
                }
            } catch (e) {}

            badge.className = "inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-xs font-medium bg-rose-500/10 text-rose-400 border border-rose-500/20";
            dot.className = "w-1.5 h-1.5 rounded-full bg-rose-400";
            text.textContent = "离线";
        }

        // 页面打开时检测，之后每 15 秒轮询一次保持真实
        checkHealth();
        setInterval(checkHealth, 15000);

        function adjustTextarea(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 160) + 'px';
        }

        function clearChat() {
            if (isGenerating) return;
            conversationHistory = [];
            document.getElementById('messagesList').innerHTML = '';
        }

        function appendMessage(role, text) {
            const messagesList = document.getElementById('messagesList');
            const messageWrapper = document.createElement('div');
            messageWrapper.className = `flex gap-3 ${role === 'user' ? 'justify-end' : 'justify-start'}`;

            if (role === 'user') {
                messageWrapper.innerHTML = `
                    <div class="max-w-[85%] sm:max-w-[75%] rounded-2xl rounded-tr-sm bg-emerald-600 text-white px-4 py-2.5 shadow-sm text-sm whitespace-pre-wrap leading-relaxed">
                        ${escapeHtml(text)}
                    </div>
                `;
            } else {
                messageWrapper.innerHTML = `
                    <div class="w-7 h-7 rounded-lg bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center justify-center shrink-0 mt-0.5">
                        <i data-lucide="bot" class="w-4 h-4"></i>
                    </div>
                    <div class="max-w-[85%] sm:max-w-[85%] rounded-2xl rounded-tl-sm bg-slate-800/80 border border-slate-700/60 px-4 py-2.5 shadow-sm text-sm text-slate-100">
                        <div class="markdown-body leading-relaxed"></div>
                    </div>
                `;
            }

            messagesList.appendChild(messageWrapper);
            lucide.createIcons();
            scrollToBottom();
            return messageWrapper;
        }

        function escapeHtml(string) {
            return String(string).replace(/[&<>"']/g, function (s) {
                return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[s];
            });
        }

        function scrollToBottom() {
            const container = document.getElementById('chatContainer');
            container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
        }

        async function sendMessage() {
            const textarea = document.getElementById('inputMessage');
            const sendBtn = document.getElementById('sendBtn');
            const message = textarea.value.trim();

            if (!message || isGenerating) return;

            isGenerating = true;
            sendBtn.disabled = true;
            textarea.value = '';
            textarea.style.height = 'auto';

            appendMessage('user', message);

            const botMessageEl = appendMessage('assistant', '');
            const markdownContainer = botMessageEl.querySelector('.markdown-body');
            markdownContainer.innerHTML = '<span class="cursor-blink"></span>';

            let fullReply = '';

            try {
                const response = await fetch('chat/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: message,
                        history: conversationHistory
                    })
                });

                if (!response.ok) {
                    throw new Error(`服务异常: ${response.status}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const chunk = line.slice(6);
                            if (chunk === '[DONE]') break;
                            
                            fullReply += chunk;
                            markdownContainer.innerHTML = marked.parse(fullReply) + '<span class="cursor-blink"></span>';
                            markdownContainer.querySelectorAll('pre code').forEach((block) => {
                                hljs.highlightElement(block);
                            });
                            scrollToBottom();
                        }
                    }
                }

                markdownContainer.innerHTML = marked.parse(fullReply || '（空响应）');
                markdownContainer.querySelectorAll('pre code').forEach((block) => {
                    hljs.highlightElement(block);
                });

                conversationHistory.push({ role: 'user', content: message });
                conversationHistory.push({ role: 'assistant', content: fullReply });

            } catch (err) {
                markdownContainer.innerHTML = `<span class="text-rose-400">请求失败: ${err.message}</span>`;
            } finally {
                isGenerating = false;
                sendBtn.disabled = false;
                textarea.focus();
                scrollToBottom();
            }
        }

        document.getElementById('inputMessage').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
